version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CORS_ORIGINS=http://localhost:5173
      - REDIS_URL=redis://:vigilagent-redis-secret@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - scan_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    environment:
      - API_AUTH_KEY=${API_AUTH_KEY:-dev-test-key-12345678901234567890}
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass vigilagent-redis-secret
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vigilagent-redis-secret", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  scan_data:
  redis_data:
