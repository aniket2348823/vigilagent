# Alertmanager configuration for Vigilagent
# Alerts are routed to the backend webhook endpoint for processing.

global:
  resolve_timeout: 5m

route:
  receiver: "vigilagent-webhook"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "vigilagent-webhook"
      repeat_interval: 1h

receivers:
  - name: "vigilagent-webhook"
    webhook_configs:
      - url: "http://backend:8000/api/v1/defense/alerts"
        send_resolved: true
    # Uncomment below to also send to Slack:
    # slack_configs:
    #   - api_url: "${SLACK_WEBHOOK_URL}"
    #     channel: "#vigilagent-alerts"
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
